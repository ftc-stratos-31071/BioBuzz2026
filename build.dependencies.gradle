repositories {
    mavenCentral()
    google() // Needed for androidx
    maven { url = 'https://maven.brott.dev/' }
    maven {url "https://repo.dairy.foundation/releases" }

}

dependencies {
    implementation 'org.firstinspires.ftc:Inspection:12.0.0'
    implementation 'org.firstinspires.ftc:Blocks:12.0.0'
    implementation 'org.firstinspires.ftc:RobotCore:12.0.0'
    implementation 'org.firstinspires.ftc:RobotServer:12.0.0'
    implementation 'org.firstinspires.ftc:OnBotJava:12.0.0'
    implementation 'org.firstinspires.ftc:Hardware:12.0.0'
    implementation 'org.firstinspires.ftc:FtcCommon:12.0.0'
    implementation 'org.firstinspires.ftc:Vision:12.0.0'
    implementation 'androidx.appcompat:appcompat:1.2.0'

    implementation "org.solverslib:core:0.3.6" // solverslib

    implementation("dev.frozenmilk.sinister:Sloth:0.3.2") // sloth
    implementation("com.bylazar.sloth:fullpanels:0.3.2+1.0.13") // panels + sloth's panels extension

    // PEDRO PATHING (commented out while we are using panels because they do not mix):
//    implementation 'com.pedropathing:revhub:3.0.2' // pedroPathing
//    implementation 'com.pedropathing:tuning:1.0.3' // pedroPathing
//    implementation "org.solverslib:pedroPathing:0.3.6" // pedroPathing extension for solvers lib
    }

